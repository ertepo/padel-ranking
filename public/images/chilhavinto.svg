<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Chi l'ha vinto?">
  <defs>
    <clipPath id="chv-frame">
      <rect x="0" y="0" width="800" height="450" />
    </clipPath>
  </defs>

  <g clip-path="url(#chv-frame)">
    <!-- Sfondo diviso: blu per le finali maschili, rosa per quelle femminili, come nel gioco -->
    <rect x="0" y="0" width="800" height="450" fill="#93c5fd" />
    <polygon points="360,0 800,0 800,450 480,450" fill="#fca5a5" />

    <!-- Titolo -->
    <text x="400" y="52" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="34" fill="#000" letter-spacing="1">CHI L'HA VINTO?</text>

    <!-- Barra del tempo -->
    <rect x="180" y="72" width="440" height="16" fill="#fff" stroke="#000" stroke-width="4" />
    <rect x="182" y="74" width="270" height="12" fill="#ffcc00" />

    <!-- Tessera torneo + anno (club-card) -->
    <rect x="168" y="112" width="440" height="112" fill="#000" />
    <rect x="180" y="100" width="440" height="112" fill="#fff" stroke="#000" stroke-width="4" />
    <text x="400" y="140" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#475569">FINALE MASCHILE</text>
    <text x="400" y="178" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="38" fill="#000">WIMBLEDON 1980</text>

    <!-- Tessera 1: Björn Borg (dark-club-card, ombra gialla) -->
    <rect x="188" y="248" width="190" height="140" fill="#ffcc00" />
    <rect x="200" y="236" width="190" height="140" fill="#fff" stroke="#000" stroke-width="4" />
    <text x="295" y="292" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="700" font-size="20" fill="#000">Björn</text>
    <text x="295" y="326" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="30" letter-spacing="1" fill="#000">BORG</text>

    <!-- Tessera 2: John McEnroe (dark-club-card, ombra gialla) -->
    <rect x="398" y="248" width="202" height="140" fill="#ffcc00" />
    <rect x="410" y="236" width="202" height="140" fill="#fff" stroke="#000" stroke-width="4" />
    <text x="511" y="292" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="700" font-size="20" fill="#000">John</text>
    <text x="511" y="326" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="26" letter-spacing="1" fill="#000">MCENROE</text>

    <!-- Pallina da tennis decorativa -->
    <g transform="translate(714,60)">
      <circle r="30" fill="#ffcc00" stroke="#000" stroke-width="4" />
      <path d="M -21,-21 A 30,30 0 0 0 -21,21" fill="none" stroke="#000" stroke-width="3" />
      <path d="M 21,-21 A 30,30 0 0 1 21,21" fill="none" stroke="#000" stroke-width="3" />
    </g>
  </g>
</svg>
