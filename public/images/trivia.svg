<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Trivia">
  <rect x="0" y="0" width="800" height="450" fill="#EDE9E1" />

  <!-- Pallina da tennis decorativa -->
  <g transform="translate(50,42)">
    <circle r="26" fill="#ffcc00" stroke="#000" stroke-width="4" />
    <path d="M -18,-18 A 26,26 0 0 0 -18,18" fill="none" stroke="#000" stroke-width="3" />
    <path d="M 18,-18 A 26,26 0 0 1 18,18" fill="none" stroke="#000" stroke-width="3" />
  </g>

  <!-- Titolo -->
  <text x="400" y="48" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="32" letter-spacing="2" fill="#000">TRIVIA</text>

  <!-- Riga domanda/punteggio -->
  <text x="80" y="72" font-family="'Arial Black', Helvetica, sans-serif" font-weight="700" font-size="16" letter-spacing="1" fill="#475569">DOMANDA 7/15</text>
  <text x="720" y="72" text-anchor="end" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="22" fill="#000">740 PT</text>

  <!-- Barra del tempo -->
  <rect x="80" y="80" width="640" height="14" fill="#fff" stroke="#000" stroke-width="4" />
  <rect x="82" y="82" width="420" height="10" fill="#ffcc00" />

  <!-- Tessera domanda (club-card) -->
  <rect x="68" y="112" width="640" height="120" fill="#000" />
  <rect x="80" y="100" width="640" height="120" fill="#fff" stroke="#000" stroke-width="4" />
  <text x="400" y="132" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#64748b">TENNIS · REGOLE</text>
  <text x="400" y="174" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="26" fill="#000">Su quale superficie si gioca Wimbledon?</text>

  <!-- 4 tessere di risposta (dark-club-card, ombre colorate a rotazione) -->
  <rect x="68" y="258" width="310" height="78" fill="#005ad8" />
  <rect x="80" y="246" width="310" height="78" fill="#fff" stroke="#000" stroke-width="4" />
  <text x="235" y="294" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="22" fill="#000">Erba</text>

  <rect x="398" y="258" width="310" height="78" fill="#6d42bb" />
  <rect x="410" y="246" width="310" height="78" fill="#fff" stroke="#000" stroke-width="4" />
  <text x="565" y="294" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="20" fill="#000">Terra rossa</text>

  <rect x="68" y="352" width="310" height="78" fill="#ffcc00" />
  <rect x="80" y="340" width="310" height="78" fill="#fff" stroke="#000" stroke-width="4" />
  <text x="235" y="388" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="22" fill="#000">Cemento</text>

  <rect x="398" y="352" width="310" height="78" fill="#318a5d" />
  <rect x="410" y="340" width="310" height="78" fill="#fff" stroke="#000" stroke-width="4" />
  <text x="565" y="388" text-anchor="middle" font-family="'Arial Black', Helvetica, sans-serif" font-weight="900" font-size="22" fill="#000">Moquette</text>
</svg>
